#
# Configuration Options for Cosmetics
#
# Config options for MythicCosmetics. Learn more on the wiki here:
#
# Manual - https://git.mythiccraft.io/mythiccosmetics/MythicCosmetics/-/wikis/home
# Discord - https://www.discord.gg/MythicCraft
#
Configuration:

  #================================================================================
  # Information for where data is stored
  #================================================================================

  Storage:
    Driver: JSON

  #================================================================================
  # General Options
  #================================================================================

  General:
    EquipDelay: 5                    # Delay before equipping when a player joins
    GenerateDefaultPacks: true       # Whether to generate the default example pack folders on first startup

  # Enable/disable commands for cosmetic items
  Commands:
    Mount: true
    Pet: true
    Emote: true

  Emotes:
    # Camera offset while viewing your own emote, stored as x,y,z,yaw,pitch using Orient short form.
    # Example: "0,0,2,180,0" places the camera 2 blocks in front of the player and turns it back toward them.
    CameraOffset: "0,1.45,3.75,180,4.57"

  Menus:
    Close-On-Unequip: false

    # Optional sub-menus for the main customize menu.
    # Each entry registers a submenu by id.
    # The menu file is inferred as config/cosmetics/menus/category_<id>.yml
    # and can be opened using an icon id of SUBMENU_<id> or BUTTON_SUBMENU_<id>.
    SubMenus:
      - animations
      - appearance
      - chat
      - summons

  # Plugin Assets refer to things like menu GUIs, icons, etc.
  # These can be automatically implicitly generated by Crucible from a given pack
  Assets:
    CrucibleGeneration: false        # Should plugin assets be auto-generated by Crucible
    PackToGenerateFrom: ".internal"  # Mythic Pack to generate plugin assets from

  #================================================================================
  # Cosmetic Categories
  # Used to group cosmetics together for easier management
  # Can also be defined in pack files at cosmetics/categories.yml
  #================================================================================

  Categories:
    christmas:
      Display: "<red>Christmas"
      Enabled: false
    halloween:
      Display: "<gold>Halloween"
      Enabled: true

  #================================================================================
  # Cosmetic Rarities
  # Used to define rarity tiers for cosmetics for various purposes
  #================================================================================

  Rarities:
    Default: common
    ShowRarity: false               # Whether to prepend the cosmetic rarity to icon lore
    RarityPrefix: ""                # Prefix added before the rarity text in cosmetic icon lore
                                    # If a rarity/type price is not set, it defaults to -1 (unpurchaseable)
    Definitions:
      - Key: common
        Weight: 100
        Display: "<gray>Common"
        Prices:
          HAT: 100
          BACK: 125
          ACCESSORY: 150
          PET: 200
          MOUNT: 250
      - Key: uncommon
        Weight: 25
        Display: "<aqua>Uncommon"
        Prices:
          HAT: 250
          BACK: 300
          ACCESSORY: 350
          PET: 500
          MOUNT: 600
      - Key: rare
        Weight: 5
        Display: "<dark_purple>Rare"
        Prices:
          HAT: 750
          BACK: 900
          ACCESSORY: 1000
          PET: 1500
          MOUNT: 2000
      - Key: legendary
        Weight: 1
        Display: "<gold>Legendary"
        Prices:
          HAT: 1500
          BACK: 1800
          ACCESSORY: 2000
          PET: 3000
          MOUNT: 4000

  #================================================================================
  # Options for Shops
  #================================================================================

  Shop:
    CurrencyType: NATIVE
    DefaultCurrencyName: Coins
    Holograms:
      Enabled: true
      Height: 2.6
      # Shop hologram line prefixes:
      # {has-price} Only show this line if the cosmetic has a valid price.
      # {has-stock} Only show this line if the shop has finite stock configured.
      # {has-group} Only show this line if the shop belongs to a group.
      # {has-category} Only show this line if the cosmetic has at least one category.
      # {has-bundle} Only show this line if the current offer is a bundle.
      # {contents_count} Shows the total number of cosmetics in a bundle.
      # {bundle_types} Shows the bundle's cosmetic types as a comma-separated list.
      Lines:
        - "<yellow>{name}"
        - "<gray>{type}"
        - "{has-bundle}<dark_gray>{bundle}"
        - "{has-bundle}<gray>{contents_count} items"
        - "{has-category}<gray>{category}"
        - "<gray>{rarity}"
        - "{has-price}<gold>{price}"
        - "{has-stock}<gray>Stock: <white>{stock}"
        - "{has-stock}<gray>{status}"
        - "{has-group}<dark_gray>{group}"
      RefreshLines:
        - "<aqua>{group}"
        - "<gray>Next refresh: <white>{next_refresh}"
        - "<gray>In: <white>{countdown}"
    Groups:
      # Shop groups can also be defined in pack files at cosmetics/groups.yml.
      example_group:
        Display: "<aqua>Example Group"
        RefreshType: DAILY
        RefreshHour: 0
        RefreshMinute: 0
        RefreshDay: MONDAY
        BundleMode: ALLOW
        RefreshHologramLocation: "world,100.5,68.0,200.5,0.0,0.0"
        IncludeCategories:
          #- christmas []
        ExcludeCategories:
          #- halloween []
        # Cosmetic filters use TYPE.id so duplicate cosmetic ids across different types stay unambiguous.
        IncludeCosmetics: []
          #- HAT.santa_hat
        ExcludeCosmetics: []
          #- HAT.spooky_hat
        IncludeBundles: []
          #- winter_bundle
        ExcludeBundles: []
          #- halloween_bundle
        Stock:
          HAT: 5
          HAT.legendary: 1
        AllowedTypes:
          - HAT
          - BACK
        MaxTypes:
          HAT: 1
          BACK: 1
        MinTypes:
          HAT: 1
        MaxRarities:
          legendary: 1

  #================================================================================
  # Options for Chat
  #================================================================================

  Chat:
    Enabled: false                   # Enable chat formatting override
    Format: "{tag}{name}: {message}"
    TagFormat: "{tag} "
    UseStickerTag: true
    ShoutPrefix: "!"                 # The prefix to activate shout colors
    ShoutCooldown: 120               # The cooldown of shout colors, in seconds

  #================================================================================
  # Options for Wardrobe
  #================================================================================

  Wardrobe:
    Enabled: true                    # Master toggle for the wardrobe system (both inline and room-based).
    AllowInline: true                # Whether players can open the inline wardrobe (spawns in front of them).
                                     # Set to false to only allow fixed wardrobe rooms.
    Radius: 8                        # How far (in blocks) a player can move before the inline wardrobe
                                     # auto-closes. Set to -1 to disable the distance check.

  #================================================================================
  # Options for Cosmetic Types
  #================================================================================

  Backs:
    WearerOffset: "0 -0.18 0"  # Default offset for display-entity back cosmetics shown only to the wearer.
    # Useful for lowering backpacks in first person so they block the camera less.
    Alignments:
      SNEAKING:
        Offset: "0 -0.08 0.1"
        WearerOffset: "0 -0.26 0.1"
        DisplayRotation: "+18"
      SWIMMING:
        Offset: "0 0.12 0.4"
        WearerOffset: "0 -0.04 0.4"
        UseHeadPitch: true
        DisplayPitch: "+90"
        DisplayRotation: "+90"
        DisplayScale: 0.45
      FALL_FLYING:
        Offset: "0 0.04 0.22"
        WearerOffset: "0 -0.14 0.22"
        UseHeadPitch: true
        DisplayPitch: "+35"
        DisplayRotation: "+35"

  ChatColor:
    DefaultColorHex: '#FFFFFF'         # Used in previews and as the normal chat fallback when no chat color is equipped
    DefaultColorMarkdown: '<#FFFFFF>'  # Prepended to regular chat messages when no chat color is equipped
    DefaultItemModel: 'mythic:ui/dye_swatch' # Default menu icon item model when a chat color cosmetic does not define Model

  ShoutColor:
    DefaultColorHex: '#FFFFFF'         # Used in previews and as the shout fallback when no chat or shout color is equipped
    DefaultColorMarkdown: '<#FFFFFF>'  # Prepended to shout messages when no chat or shout color is equipped
    DefaultItemModel: 'mythic:ui/dye_swatch' # Default menu icon item model when a shout color cosmetic does not define Model

  Sprays:
    Sound: 'entity.cat.hiss'
    Volume: 1.0
    Pitch: 2.0
    ReplaceLast: true
    PersistTime: 60

  Stickers:
    UsableAsEmojis: true
    UsableAsSprays: true

  #================================================================================
  # Converter Options
  # Used to convert cosmetics from other plugins (e.g. HMCCosmetics) into
  # MythicCosmetics format. Set to false to re-run conversion on next restart.
  #================================================================================

  Converter:
    HMCCosmeticsConverted: false
